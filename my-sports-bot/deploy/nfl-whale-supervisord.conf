[program:nfl-whale]
command=/home/trinity/.pyenv/shims/python nfl_whale_service.py
directory=/home/trinity/polymarket-bots/my-sports-bot
user=trinity
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=10
